services:
  treedx-api:
    cpus: ${TREEDX_API_CPU_LIMIT:-4.0}
    mem_limit: ${TREEDX_API_MEMORY_LIMIT:-4g}
    build:
      context: .
      target: prod
    environment:
      PHX_SERVER: "true"
      PHX_HOST: 0.0.0.0
      PORT: "4000"
      TREEDX_DATA_DIR: /var/lib/treedx
      TREEDX_AUTH_MODE: connected
      TREEDX_REGISTRY_MODE: connected
      TREEDX_NODE_ID: node_local
      TREEDX_RUNTIME_CPU_BUDGET: ${TREEDX_RUNTIME_CPU_BUDGET:-4}
      TREEDX_RUNTIME_MEMORY_BUDGET_MB: ${TREEDX_RUNTIME_MEMORY_BUDGET_MB:-4096}
      TREEDX_REPO_CONTEXT_CACHE_TTL_MS: ${TREEDX_REPO_CONTEXT_CACHE_TTL_MS:-5000}
      TREEDX_AUTHORIZATION_CACHE_TTL_MS: ${TREEDX_AUTHORIZATION_CACHE_TTL_MS:-5000}
      TREEDX_AUTH_TOKEN_CACHE_TTL_MS: ${TREEDX_AUTH_TOKEN_CACHE_TTL_MS:-5000}
      TREEDX_AUDIT_ASYNC: "true"
      TREEDX_AUDIT_BATCH_SIZE: ${TREEDX_AUDIT_BATCH_SIZE:-5000}
      TREEDX_AUDIT_FLUSH_INTERVAL_MS: ${TREEDX_AUDIT_FLUSH_INTERVAL_MS:-5000}
      TREEDX_AUDIT_QUEUE_MAX: ${TREEDX_AUDIT_QUEUE_MAX:-20000}
      TREEDX_REPOSITORY_QUERY_POOL_SIZE: ${TREEDX_REPOSITORY_QUERY_POOL_SIZE:-32}
    ports:
      - "4000:4000"
    volumes:
      - treedx-data:/var/lib/treedx
    restart: unless-stopped

volumes:
  treedx-data:
