id: treedx
name: TreeDX
kind: beam-elixir-rust
type: image-service
repository: treeseed-ai/treedx
versionSource: apps/api/mix.exs
image: treeseed/treedx
workflowTemplateVersion: custom
workflowDependencies: []
deploymentSource:
  staging: git
  prod: image
releaseGate:
  workflow: .github/workflows/release-gate.yml
dockerImages:
  releaseWorkflow: release-gate.yml
  architectures:
    - amd64
    - arm64
artifacts:
  - provider: docker
    name: treeseed/treedx
    dockerfile: Dockerfile
    target: prod
    role: service
    architectures:
      - amd64
      - arm64
  - provider: docker
    name: treeseed/treedx-profiler
    dockerfile: Dockerfile.profiler
    target: profiler
    role: profiler
    architectures:
      - amd64
      - arm64
packageRuntime:
  schemaVersion: treeseed.package-runtime/v1
  componentId: treedx
  services:
    - id: treedx
      composeService: treedx
      endpoints:
        - id: http
          protocol: http
          port: 4000
          visibility: host
          defaultAlias: treedx.treeseed.localhost
          aliasOverride: true
          tls: edge
          authentication: application
          healthGate: { protocol: http, path: /api/v1/ready, timeoutSeconds: 120 }
githubEnvironments:
  - staging
  - production
requiredSecrets:
  - DOCKERHUB_TOKEN
  - DOCKERHUB_USERNAME
  - NPM_TOKEN
  - PYPI_API_TOKEN
  - CARGO_REGISTRY_TOKEN
  - HEX_API_KEY
verify:
  fast: scripts/verification/test-treedx-fast.sh
  local: scripts/verification/test-all.sh
  release: scripts/release/release-gate.sh
projectArchitecture:
  topology: split_site_content
  rootPath: .
  sitePath: docs
  contentPath: src/content
  contentRuntimeSource: r2_preview_overlay
  localContentMaterialization: none
  contentPublishTarget:
    kind: cloudflare_r2
    prefix: packages/treedx
