name: treeseed-treedx
services:
  treedx:
    image: "@TREEDX_IMAGE@"
    restart: unless-stopped
    env_file: /etc/treeseed/components/treedx/environment
    environment:
      PHX_SERVER: "true"
      PHX_HOST: 0.0.0.0
      PORT: "4000"
      TREEDX_DATA_DIR: /var/lib/treedx
      TREEDX_AUTH_MODE: connected
      TREEDX_AUTH_VERIFIER: jwks_oidc
      TREEDX_JWKS_URL: ${TREESEED_CONTROL_PLANE_URL:?TREESEED_CONTROL_PLANE_URL is required}/.well-known/treedx-jwks.json
      TREEDX_JWT_ISSUER: ${TREEDX_JWT_ISSUER:?TREEDX_JWT_ISSUER is required}
      TREEDX_JWT_AUDIENCE: ${TREEDX_JWT_AUDIENCE:?TREEDX_JWT_AUDIENCE is required}
      TREEDX_JWT_ALLOWED_ALGS: ${TREEDX_JWT_ALLOWED_ALGS:?TREEDX_JWT_ALLOWED_ALGS is required}
      TREEDX_SECRET_KEY_BASE: ${TREEDX_SECRET_KEY_BASE:?TREEDX_SECRET_KEY_BASE is required}
      TREEDX_EXEC_BACKEND: disabled
      TREEDX_GIT_EXTERNAL_TRANSPORT_ENABLED: "true"
      TREEDX_GIT_ALLOWED_HOSTS: ${TREEDX_GIT_ALLOWED_HOSTS:?TREEDX_GIT_ALLOWED_HOSTS is required}
      TREEDX_REMOTE_CREDENTIAL_PROVIDER: http_broker
      TREEDX_REMOTE_CREDENTIAL_BROKER_URL: ${TREESEED_CONTROL_PLANE_URL:?TREESEED_CONTROL_PLANE_URL is required}/v1/internal/credential-deliveries/consume
      TREEDX_REMOTE_CREDENTIAL_BROKER_SERVICE_ID: ${TREEDX_REMOTE_CREDENTIAL_BROKER_SERVICE_ID:?TREEDX_REMOTE_CREDENTIAL_BROKER_SERVICE_ID is required}
      TREEDX_REMOTE_CREDENTIAL_BROKER_ASSERTION: ${TREEDX_REMOTE_CREDENTIAL_BROKER_ASSERTION:?TREEDX_REMOTE_CREDENTIAL_BROKER_ASSERTION is required}
    volumes:
      - type: bind
        source: ${TREESEED_COMPONENT_DATA_ROOT:-/var/lib/treeseed/components}/treedx/data
        target: /var/lib/treedx
    expose: ["4000"]
    networks: [private, platform, treeseed-edge]
    healthcheck:
      test: ["CMD", "/app/bin/treedx_healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    security_opt: ["no-new-privileges:true"]
networks:
  private: { internal: true }
  platform:
    name: treeseed-platform
    external: true
  treeseed-edge:
    name: treeseed-edge
    external: true
