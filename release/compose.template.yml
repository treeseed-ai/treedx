name: treeseed-treedx
services:
  treedx:
    image: "@TREEDX_IMAGE@"
    restart: unless-stopped
    env_file: /etc/treeseed/components/treedx/environment
    environment:
      PHX_SERVER: "true"
      PHX_HOST: 0.0.0.0
      PORT: "4000"
      TREEDX_DATA_DIR: /var/lib/treedx
      TREEDX_AUTH_MODE: connected
      TREEDX_AUTH_VERIFIER: jwks_oidc
      TREEDX_JWKS_URL: http://api:3000/.well-known/treedx-jwks.json
      TREEDX_EXEC_BACKEND: disabled
      TREEDX_REMOTE_CREDENTIAL_PROVIDER: http_broker
      TREEDX_REMOTE_CREDENTIAL_BROKER_URL: http://api:3000/v1/internal/credential-deliveries/consume
    volumes:
      - type: bind
        source: /var/lib/treeseed/components/treedx/data
        target: /var/lib/treedx
    expose: ["4000"]
    networks: [private, platform, treeseed-edge]
    healthcheck:
      test: ["CMD", "/usr/local/bin/docker-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    security_opt: ["no-new-privileges:true"]
networks:
  private: { internal: true }
  platform:
    name: treeseed-platform
    external: true
  treeseed-edge:
    name: treeseed-edge
    external: true
