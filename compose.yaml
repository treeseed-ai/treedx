services:
  treedx-api:
    build:
      context: .
      target: dev
    working_dir: /source/treedx/apps/api
    command: >-
      sh -lc "mkdir -p /workspace/treedx &&
      tar -C /source/treedx --exclude=.git --exclude=target --exclude=apps/api/deps --exclude=apps/api/_build -cf - . |
      tar -C /workspace/treedx -xf - &&
      cd /workspace/treedx/apps/api && mix deps.get && mix phx.server"
    environment:
      MIX_ENV: dev
      MIX_BUILD_PATH: /workspace/treedx/apps/api/_build
      CARGO_TARGET_DIR: /tmp/treedx-cargo-target
      PHX_SERVER: "true"
      PHX_HOST: 0.0.0.0
      PORT: "4000"
      TREEDX_DATA_DIR: /var/lib/treedx
      TREEDX_AUTH_MODE: connected
      TREEDX_AUTH_VERIFIER: ${TREESEED_TREEDX_AUTH_VERIFIER:-jwks_oidc}
      TREEDX_ALLOW_DEV_VERIFIER_IN_PROD: "true"
      TREEDX_JWT_ISSUER: ${TREESEED_TREEDX_JWT_ISSUER:-https://api.treeseed.local/treedx}
      TREEDX_JWT_AUDIENCE: ${TREESEED_TREEDX_JWT_AUDIENCE:-treedx-local}
      TREEDX_JWKS_URL: ${TREESEED_TREEDX_JWKS_URL:-http://host.docker.internal:3002/.well-known/treedx-jwks.json}
      TREEDX_JWT_HS256_SECRET: ${TREESEED_TREEDX_JWT_HS256_SECRET:-treeseed-local-treedx-jwt-secret}
      TREEDX_BOOTSTRAP_TRUST_ACTOR_ID: ${TREESEED_TREEDX_PROXY_ACTOR_ID:-treeseed-api}
      TREEDX_BOOTSTRAP_TRUST_TENANT_ID: ${TREESEED_TREEDX_PROXY_TENANT_ID:-treeseed-control-plane}
      TREEDX_BOOTSTRAP_TRUST_REPO_IDS: "*"
      TREEDX_BOOTSTRAP_TRUST_REFS: "*"
      TREEDX_BOOTSTRAP_TRUST_PATHS: "**"
      TREEDX_REGISTRY_MODE: local
      TREEDX_DEV_HOT_RELOAD: "true"
      TREEDX_SOURCE_CLOSURE_DIGEST: ${TREESEED_TREEDX_SOURCE_CLOSURE_DIGEST:-unknown}
      TREEDX_NODE_ID: node_local
      TREEDX_GIT_EXTERNAL_TRANSPORT_ENABLED: "true"
      TREEDX_GIT_SSH_ENABLED: "false"
      TREEDX_GIT_ALLOWED_HOSTS: ${TREESEED_TREEDX_GIT_ALLOWED_HOSTS:-github.com}
      TREEDX_REMOTE_CREDENTIAL_PROVIDER: http_broker
      TREEDX_REMOTE_CREDENTIAL_BROKER_URL: ${TREESEED_API_INTERNAL_URL:-http://host.docker.internal:3000}/v1/internal/credential-deliveries/consume
      TREEDX_REMOTE_CREDENTIAL_BROKER_SERVICE_ID: node_local
      TREEDX_REMOTE_CREDENTIAL_BROKER_ASSERTION: ${TREESEED_TREEDX_CREDENTIAL_BROKER_ASSERTION:-treeseed-local-credential-broker-assertion}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "4000:4000"
    volumes:
      - .:/source/treedx:ro
      - "${TREESEED_TREEDX_HOST_DATA_DIR:-../../.treeseed/local-treedx/data}:/var/lib/treedx"
      - treedx-cargo-target:/tmp/treedx-cargo-target
    tmpfs:
      - /workspace/treedx:exec,mode=1777
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4000/api/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

volumes:
  treedx-cargo-target:
