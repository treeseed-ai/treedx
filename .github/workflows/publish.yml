name: Build or Promote TreeDX Candidate

on:
  push:
    branches: [staging]
    tags: ["*.*.*"]

env:
  CARGO_TARGET_DIR: /tmp/treedx-target

jobs:
  candidate-package:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 24, registry-url: "https://registry.npmjs.org" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: dtolnay/rust-toolchain@stable
      - uses: erlef/setup-beam@v1
        with: { otp-version: "27", elixir-version: "1.17.3" }
      - name: Build exact TypeScript archive
        working-directory: packages/ts-sdk
        run: |
          npm ci
          npm run treedx:check-generated
          npm run build
          mkdir -p ../../source-assets/npm
          npm pack --ignore-scripts --pack-destination ../../source-assets/npm
          npm sbom --sbom-format cyclonedx > ../../source-assets/sbom.cdx.json
      - name: Build exact Python archives
        working-directory: packages/python-sdk
        run: |
          python -m pip install --upgrade pip build twine
          python -m pip install -e '.[dev]'
          python scripts/check_treedx_generated_types.py
          python -m build --outdir ../../source-assets/python
          python -m twine check ../../source-assets/python/*
      - name: Build exact Rust crate
        working-directory: packages/rust-sdk
        run: |
          node scripts/check_treedx_generated_types.mjs
          cargo package --locked
          mkdir -p ../../source-assets/rust
          cp /tmp/treedx-target/package/*.crate ../../source-assets/rust/
      - name: Build exact Hex archive
        working-directory: packages/elixir-sdk
        run: |
          mix local.hex --force
          mix deps.get
          MIX_ENV=dev mix deps.get
          mix run scripts/check_treedx_generated_types.exs
          MIX_ENV=dev mix hex.build
          mkdir -p ../../source-assets/hex
          cp treedx-*.tar ../../source-assets/hex/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: { name: "treedx-source-${{ github.sha }}", path: source-assets/, if-no-files-found: error }

  candidate-build:
    if: github.ref == 'refs/heads/staging'
    needs: candidate-package
    environment: development
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: treeseed/treedx, file: Dockerfile, target: prod, arch: amd64, platform: linux/amd64, runner: ubuntu-24.04 }
          - { image: treeseed/treedx, file: Dockerfile, target: prod, arch: arm64, platform: linux/arm64, runner: ubuntu-24.04-arm }
          - { image: treeseed/treedx-profiler, file: Dockerfile.profiler, target: profiler, arch: amd64, platform: linux/amd64, runner: ubuntu-24.04 }
          - { image: treeseed/treedx-profiler, file: Dockerfile.profiler, target: profiler, arch: arm64, platform: linux/arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with: { username: "${{ vars.DOCKERHUB_USERNAME }}", password: "${{ secrets.DOCKERHUB_TOKEN }}" }
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          push: true
          tags: "${{ matrix.image }}:candidate-${{ github.sha }}-${{ matrix.arch }}"
          sbom: true
          provenance: mode=max

  candidate-seal:
    if: github.ref == 'refs/heads/staging'
    needs: candidate-build
    environment: development
    runs-on: ubuntu-24.04
    permissions: { actions: read, contents: read }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 24 }
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: release
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with: { username: "${{ vars.DOCKERHUB_USERNAME }}", password: "${{ secrets.DOCKERHUB_TOKEN }}" }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: { name: "treedx-source-${{ github.sha }}", path: release-assets }
      - name: Require exact protected staging verification
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          for attempt in {1..60}; do
            conclusion="$(gh run list --workflow release-gate.yml --commit "$GITHUB_SHA" --event push --limit 1 --json conclusion --jq '.[0].conclusion // ""')"
            if [[ "$conclusion" == success ]]; then exit 0; fi
            if [[ -n "$conclusion" && "$conclusion" != success ]]; then echo "Exact staging release gate concluded $conclusion" >&2; exit 1; fi
            sleep 30
          done
          echo 'Exact staging release gate did not complete within 30 minutes.' >&2
          exit 1
      - name: Seal exact images, component assets, and package archives
        run: |
          for pair in TREEDX=treeseed/treedx TREEDX_PROFILER=treeseed/treedx-profiler; do
            key="${pair%%=*}"; image="${pair#*=}"; candidate="candidate-${GITHUB_SHA}"
            docker buildx imagetools create -t "${image}:${candidate}" "${image}:${candidate}-amd64" "${image}:${candidate}-arm64"
            digest="$(docker buildx imagetools inspect "${image}:${candidate}" --format '{{json .Manifest}}' | jq -r '.digest')"
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            export "TREESEED_${key}_DIGEST=$digest"
          done
          export TREESEED_RELEASE="$(node -p "require('./packages/ts-sdk/package.json').version")"
          export TREESEED_SOURCE_COMMIT="$GITHUB_SHA" TREESEED_TREEDX_DIGEST TREESEED_TREEDX_PROFILER_DIGEST
          node release/create-component-release.mjs
          npm --prefix release run custody -- seal release-assets/release-evidence-v1.json release-assets
          npm --prefix release run custody -- verify release-assets/release-evidence-v1.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: { name: "treedx-candidate-${{ github.sha }}", path: release-assets/, if-no-files-found: error, retention-days: 30 }

  promote:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions: { actions: read, contents: write, id-token: write }
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 24, registry-url: "https://registry.npmjs.org" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: release
      - run: python -m pip install --upgrade twine
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with: { username: "${{ vars.DOCKERHUB_USERNAME }}", password: "${{ secrets.DOCKERHUB_TOKEN }}" }
      - name: Download exact accepted candidate
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/staging)"
          run_id="$(gh run list --workflow publish.yml --branch staging --commit "$GITHUB_SHA" --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$run_id"
          gh run download "$run_id" --name "treedx-candidate-${GITHUB_SHA}" --dir candidate
          npm --prefix release run check-tag
          npm --prefix release run custody -- verify candidate/release-evidence-v1.json
      - id: before
        run: echo "latest=$(npm view @treeseed/treedx dist-tags.latest)" >> "$GITHUB_OUTPUT"
      - name: Publish exact SDK archives
        env:
          NODE_AUTH_TOKEN: "${{ secrets.NPM_TOKEN }}"
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: "${{ secrets.PYPI_API_TOKEN }}"
          CARGO_REGISTRY_TOKEN: "${{ secrets.CARGO_REGISTRY_TOKEN }}"
          HEX_API_KEY: "${{ secrets.HEX_API_KEY }}"
        run: |
          npm publish "$(find candidate/npm -maxdepth 1 -name '*.tgz' -print -quit)" --access public --tag rc --provenance
          python -m twine upload --non-interactive candidate/python/*
          npm --prefix release run publish-crate -- "$(find candidate/rust -maxdepth 1 -name '*.crate' -print -quit)"
          npm --prefix release run publish-hex -- "$(find candidate/hex -maxdepth 1 -name '*.tar' -print -quit)"
      - name: Promote exact image manifests
        run: |
          node -e "const e=require('./candidate/release-evidence-v1.json'); for(const a of e.artifacts.filter(x=>x.kind==='oci-image')) console.log(a.identity)" | while read -r identity; do
            image="${identity%@*}"; digest="${identity#*@}"
            docker buildx imagetools create -t "${image}:${GITHUB_REF_NAME}" "$identity"
            test "$(docker buildx imagetools inspect "${image}:${GITHUB_REF_NAME}" --format '{{json .Manifest}}' | jq -r '.digest')" = "$digest"
          done
      - name: Verify registry read-back and publish unchanged assets
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}", EXPECTED_LATEST: "${{ steps.before.outputs.latest }}" }
        run: |
          test "$(npm view @treeseed/treedx dist-tags.latest)" = "$EXPECTED_LATEST"
          version="$GITHUB_REF_NAME"
          registry_readback="$(mktemp -d)"
          fetch() {
            local url="$1" output="$2"
            for attempt in {1..60}; do
              if curl --fail --location --silent --show-error -H 'User-Agent: TreeSeed-release-custody/1' "$url" -o "$output"; then return 0; fi
              if [[ "$attempt" -lt 60 ]]; then sleep 3; fi
            done
            return 1
          }
          fetch "https://registry.npmjs.org/@treeseed/treedx/-/treedx-${version}.tgz" "$registry_readback/npm.tgz"
          test "$(sha256sum candidate/npm/*.tgz | awk '{print $1}')" = "$(sha256sum "$registry_readback/npm.tgz" | awk '{print $1}')"
          python_version="${version/-rc./rc}"
          fetch "https://pypi.org/pypi/treedx/${python_version}/json" "$registry_readback/pypi.json"
          for archive in candidate/python/*; do
            digest="$(sha256sum "$archive" | awk '{print $1}')"
            jq -e --arg digest "$digest" 'any(.urls[]; .digests.sha256 == $digest)' "$registry_readback/pypi.json" >/dev/null
          done
          expected_crate="$(sha256sum candidate/rust/*.crate | awk '{print $1}')"
          fetch "https://crates.io/api/v1/crates/treedx/${version}" "$registry_readback/crates.json"
          test "$(jq -r '.version.checksum' "$registry_readback/crates.json")" = "$expected_crate"
          expected_hex="$(sha256sum candidate/hex/*.tar | awk '{print $1}')"
          fetch "https://hex.pm/api/packages/treedx/releases/${version}" "$registry_readback/hex.json"
          test "$(jq -r '.checksum' "$registry_readback/hex.json")" = "$expected_hex"
          mapfile -d '' assets < <(find candidate -type f -print0)
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" --generate-notes --verify-tag --prerelease

  promotion-does-not-build:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: node --test release/custody.test.mjs
